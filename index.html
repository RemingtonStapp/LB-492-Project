<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escaping the Nuclear Epoch</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
    }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(100%, 980px);
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      flex-wrap: wrap;
    }
    .panel {
      background: #1d1d1d;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 8px 12px;
    }
    canvas {
      width: min(100%, 960px);
      height: auto;
      background: #08131d;
      border: 3px solid #ddd;
      border-radius: 10px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls {
      width: 100%;
      line-height: 1.5;
    }
    button {
      background: #f2c14e;
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Escaping the Nuclear Epoch</h1>
    <div class="hud">
      <div class="panel">Lives: <span id="lives">3</span></div>
      <button id="restartBtn">Restart</button>
    </div>
    <canvas id="game" width="960" height="720"></canvas>
    <div class="panel controls">
      <strong>Controls:</strong> Left/Right to move, Up/Down on ladders, Space to jump. Reach the portal while avoiding toxic waste barrels.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives');
    const restartBtn = document.getElementById('restartBtn');

    const W = canvas.width;
    const H = canvas.height;
    const GRAVITY = 0.45;
    const PLAYER_SPEED = 3.2;
    const CLIMB_SPEED = 2.3;
    const JUMP_SPEED = -6.8;
    const BARREL_RADIUS = 11;
    const PLAYER_HEAD_BONK_MARGIN = 20;
    const BARREL_PLATFORM_DIRECTIONS = {
      5: 1,
      4: -1,
      3: 1,
      2: -1,
      1: 1,
      0: -1
    };

    const keys = {};
    let lives = 3;
    let gameOver = false;
    let win = false;
    let barrelSpawnTimer = 0;
    let gameClock = 0;
    let explosionActive = false;
    let explosionTimer = 0;
    let gameOverMessage = 'Press Restart to try again.';
    let inWinZone = false;

    const platforms = [
      { x1: 120, y1: 640, x2: 940, y2: 600, thickness: 10 },
      { x1: 40,  y1: 525, x2: 860, y2: 565, thickness: 10 },
      { x1: 120, y1: 470, x2: 940, y2: 430, thickness: 10 },
      { x1: 40,  y1: 335, x2: 860, y2: 375, thickness: 10 },
      { x1: 120, y1: 280, x2: 940, y2: 240, thickness: 10 },
      { x1: 80,  y1: 110, x2: 880, y2: 110, thickness: 10 }
    ];

    const ladderDefs = [
      { x: 740, topPlatform: 1, bottomPlatform: 0, width: 28 },
      { x: 250, topPlatform: 2, bottomPlatform: 1, width: 28 },
      { x: 710, topPlatform: 3, bottomPlatform: 2, width: 28 },
      { x: 330, topPlatform: 4, bottomPlatform: 3, width: 28 },
      { x: 760, topPlatform: 5, bottomPlatform: 4, width: 28 },
      { x: 260, topPlatform: 5, bottomPlatform: 4, width: 28 }
    ];

    const ladders = ladderDefs.map(l => {
      const centerX = l.x + l.width / 2;
      const topY = lineYAtX(platforms[l.topPlatform], centerX);
      const bottomY = lineYAtX(platforms[l.bottomPlatform], centerX);
      return {
        x: l.x,
        yTop: Math.min(topY, bottomY),
        yBottom: Math.max(topY, bottomY),
        width: l.width
      };
    });

    const goal = { x: 790, y: 62, w: 70, h: 38 };
    const kong = { x: 120, y: 42, w: 110, h: 92 };
    const spawn = { x: 215, y: 95 };

    const winZonePlatforms = [
      { x1: 40,  y1: 650, x2: 920, y2: 650, thickness: 14 },
      { x1: 80,  y1: 520, x2: 320, y2: 520, thickness: 14 },
      { x1: 390, y1: 455, x2: 600, y2: 455, thickness: 14 },
      { x1: 680, y1: 360, x2: 900, y2: 360, thickness: 14 }
    ];

    const winZoneLadders = [
      { x: 190, yTop: 520, yBottom: 650, width: 28 },
      { x: 480, yTop: 455, yBottom: 650, width: 28 },
      { x: 770, yTop: 360, yBottom: 650, width: 28 }
    ];

    const hazmatImg = new Image();
    let hazmatLoaded = false;
    hazmatImg.onload = () => { hazmatLoaded = true; };
    hazmatImg.onerror = () => { console.log('Hazmat image failed to load. Check hazmat.png filename and folder.'); };
    hazmatImg.src = 'hazmat.png';

    const toxicBarrelImg = new Image();
    let toxicBarrelLoaded = false;
    toxicBarrelImg.onload = () => { toxicBarrelLoaded = true; };
    toxicBarrelImg.onerror = () => { console.log('Toxic barrel image failed to load. Check toxic-barrel.png filename and folder.'); };
    toxicBarrelImg.src = 'toxic-barrel.png';

    const playerImg = new Image();
    let playerLoaded = false;
    playerImg.onload = () => { playerLoaded = true; };
    playerImg.onerror = () => { console.log('Player image failed to load. Check player.png filename and folder.'); };
    playerImg.src = 'player.png';

    const bunkerImg = new Image();
    let bunkerLoaded = false;
    bunkerImg.onload = () => { bunkerLoaded = true; };
    bunkerImg.onerror = () => { console.log('Bunker image failed to load. Check bunker.png filename and folder.'); };
    bunkerImg.src = 'nature2.png';

    const explosionImg = new Image();
    let explosionLoaded = false;
    explosionImg.onload = () => { explosionLoaded = true; };
    explosionImg.onerror = () => { console.log('Explosion image failed to load. Check explosion.png filename and folder.'); };
    explosionImg.src = 'explosion.png';

    const endBgImg = new Image();
    let endBgLoaded = false;
    endBgImg.onload = () => { endBgLoaded = true; };
    endBgImg.onerror = () => { console.log('End background image failed to load. Check end.png filename and folder.'); };
    endBgImg.src = 'end.png';

    const player = {
      x: 110,
      y: 580,
      w: 28,
      h: 34,
      vx: 0,
      vy: 0,
      onGround: false,
      onLadder: false,
      facing: 1,
      invuln: 0
    };

    let barrels = [];

    function getActivePlatforms() {
      return inWinZone ? winZonePlatforms : platforms;
    }

    function getActiveLadders() {
      return inWinZone ? winZoneLadders : ladders;
    }

    function resetPlayer(fullReset = false) {
      player.x = 110;
      player.y = 580;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.onLadder = false;
      player.invuln = 90;
      explosionActive = false;
      explosionTimer = 0;

      if (fullReset) {
        lives = 3;
        gameOver = false;
        win = false;
        inWinZone = false;
        gameOverMessage = 'Press Restart to try again.';
        barrels = [];
        barrelSpawnTimer = 40;
        gameClock = 0;
      }

      updateHud();
    }

    function updateHud() {
      livesEl.textContent = lives;
    }

    function lineYAtX(line, x) {
      const t = (x - line.x1) / (line.x2 - line.x1);
      return line.y1 + t * (line.y2 - line.y1);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      return {
        r: parseInt(clean.substring(0, 2), 16),
        g: parseInt(clean.substring(2, 4), 16),
        b: parseInt(clean.substring(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => {
        const clamped = Math.max(0, Math.min(255, Math.round(v)));
        return clamped.toString(16).padStart(2, '0');
      }).join('');
    }

    function blendColor(c1, c2, t) {
      const a = hexToRgb(c1);
      const b = hexToRgb(c2);
      return rgbToHex(
        lerp(a.r, b.r, t),
        lerp(a.g, b.g, t),
        lerp(a.b, b.b, t)
      );
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function getNatureProgress(y) {
      const normalized = 1 - (y / H);
      return smoothstep(0.12, 0.95, normalized);
    }

    function findSupportingPlatform(entity) {
      const activePlatforms = getActivePlatforms();
      const footX = entity.x + entity.w / 2;
      const footY = entity.y + entity.h;

      for (const p of activePlatforms) {
        const minX = Math.min(p.x1, p.x2);
        const maxX = Math.max(p.x1, p.x2);
        if (footX >= minX - 4 && footX <= maxX + 4) {
          const py = lineYAtX(p, footX);
          if (footY >= py - 8 && footY <= py + 10 && entity.vy >= 0) {
            return { platform: p, y: py };
          }
        }
      }
      return null;
    }

    function findCeilingPlatform(entity, prevTopY) {
      const activePlatforms = getActivePlatforms();
      const headX = entity.x + entity.w / 2;
      const headY = entity.y;

      for (const p of activePlatforms) {
        const minX = Math.min(p.x1, p.x2);
        const maxX = Math.max(p.x1, p.x2);
        if (headX >= minX + PLAYER_HEAD_BONK_MARGIN && headX <= maxX - PLAYER_HEAD_BONK_MARGIN) {
          const py = lineYAtX(p, headX);
          const undersideY = py + p.thickness / 2;
          if (prevTopY >= undersideY && headY <= undersideY + 6 && entity.vy < 0) {
            return { platform: p, y: undersideY };
          }
        }
      }
      return null;
    }

    function overlappingLadder(entity) {
      const activeLadders = getActiveLadders();
      const centerX = entity.x + entity.w / 2;
      const topY = entity.y;
      const bottomY = entity.y + entity.h;

      return activeLadders.find(l =>
        centerX >= l.x && centerX <= l.x + l.width &&
        bottomY >= l.yTop && topY <= l.yBottom
      ) || null;
    }

    function spawnBarrel() {
      barrels.push({
        x: spawn.x,
        y: spawn.y,
        vx: 2.2,
        vy: 0,
        radius: BARREL_RADIUS,
        active: true,
        passedJump: false,
        falling: false,
        checkLadder: false,
        fallLadder: null,
        targetPlatformAfterFall: null,
        fallType: null
      });
    }

    function updatePlayer() {
      const prevTopY = player.y;
      const ladder = overlappingLadder(player);
      player.onLadder = !!ladder && ((keys['ArrowUp'] || keys['ArrowDown']) || player.onLadder);

      if (player.onLadder && ladder) {
        player.vx = 0;
        if (keys['ArrowLeft']) player.x -= 1.1;
        if (keys['ArrowRight']) player.x += 1.1;
        if (keys['ArrowUp']) player.y -= CLIMB_SPEED;
        if (keys['ArrowDown']) player.y += CLIMB_SPEED;
        if (!keys['ArrowUp'] && !keys['ArrowDown']) player.vy = 0;
      } else {
        player.onLadder = false;
        player.vx = 0;
        if (keys['ArrowLeft']) {
          player.vx = -PLAYER_SPEED;
          player.facing = -1;
        }
        if (keys['ArrowRight']) {
          player.vx = PLAYER_SPEED;
          player.facing = 1;
        }
        player.vy += GRAVITY;
      }

      player.x += player.vx;
      player.y += player.vy;
      player.onGround = false;

      const ceiling = findCeilingPlatform(player, prevTopY);
      if (!player.onLadder && ceiling) {
        player.y = ceiling.y;
        player.vy = Math.max(0, player.vy);
      }

      const support = findSupportingPlatform(player);
      if (!player.onLadder && support) {
        player.y = support.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      player.x = Math.max(20, Math.min(W - player.w - 20, player.x));
      player.y = Math.max(0, Math.min(H - player.h, player.y));

      if (player.invuln > 0) player.invuln--;
    }

    function triggerExplosionGameOver(message = 'Press Restart to try again.') {
      explosionActive = true;
      explosionTimer = 30;
      gameOver = true;
      gameOverMessage = message;
    }

    function updateBarrels() {
      for (const b of barrels) {
        const entity = {
          x: b.x - b.radius,
          y: b.y - b.radius,
          w: b.radius * 2,
          h: b.radius * 2,
          vy: b.vy
        };

        const support = findSupportingPlatform(entity);

        if (!b.falling) {
          if (support) {
            b.y = support.y - b.radius;
            b.vy = 0;

            const platformIndex = platforms.indexOf(support.platform);
            const dir = BARREL_PLATFORM_DIRECTIONS[platformIndex] ?? 1;
            b.vx = platformIndex === 5 ? 2.2 * dir : 2.1 * dir;

            const barrelCenterX = b.x;
            const barrelBottomY = b.y + b.radius;
            const ladderBelow = ladders.find(l => {
              const ladderLeft = l.x;
              const ladderRight = l.x + l.width;
              const ladderCenter = l.x + l.width / 2;
              const nearHorizontally = barrelCenterX >= ladderLeft - 6 && barrelCenterX <= ladderRight + 6;
              const nearTopOfLadder = Math.abs(barrelBottomY - l.yTop) < 14;
              const onThisPlatform = Math.abs(lineYAtX(support.platform, ladderCenter) - l.yTop) < 18;
              return nearHorizontally && nearTopOfLadder && onThisPlatform;
            });

            if (ladderBelow && !b.checkLadder) {
              b.checkLadder = true;
              if (Math.random() < 0.22) {
                b.falling = true;
                b.fallType = 'ladder';
                b.vx = 0;
                b.vy = 3.2;
                b.fallLadder = ladderBelow;
                b.x = ladderBelow.x + ladderBelow.width / 2;
                const currentPlatformIndex = platforms.indexOf(support.platform);
                b.targetPlatformAfterFall = currentPlatformIndex - 1;
              }
            }

            if (!ladderBelow) {
              b.checkLadder = false;
            }
          } else {
            b.falling = true;
            b.fallType = 'edge';
            b.vy = 3.2;
            b.vx = 0;
            b.fallLadder = null;
            b.targetPlatformAfterFall = null;
          }
        }

        if (b.falling) {
          b.y += b.vy;
          b.vy = Math.min(b.vy + 0.15, 4.5);

          if (b.fallType === 'ladder' && b.fallLadder) {
            b.x = b.fallLadder.x + b.fallLadder.width / 2;
          }

          if (b.fallType === 'ladder' && b.targetPlatformAfterFall != null && b.targetPlatformAfterFall >= 0) {
            const targetPlatform = platforms[b.targetPlatformAfterFall];
            const targetY = lineYAtX(targetPlatform, b.x) - b.radius;
            if (b.y >= targetY) {
              b.y = targetY;
              b.vy = 0;
              b.falling = false;
              b.checkLadder = false;
              b.fallLadder = null;
              b.fallType = null;
              const platformIndex = b.targetPlatformAfterFall;
              b.targetPlatformAfterFall = null;
              const dir = BARREL_PLATFORM_DIRECTIONS[platformIndex] ?? 1;
              b.vx = platformIndex === 5 ? 2.2 * dir : 2.1 * dir;
            }
          } else if (b.fallType === 'edge') {
            const fallingEntity = {
              x: b.x - b.radius,
              y: b.y - b.radius,
              w: b.radius * 2,
              h: b.radius * 2,
              vy: b.vy
            };
            const landing = findSupportingPlatform(fallingEntity);
            if (landing) {
              b.y = landing.y - b.radius;
              b.vy = 0;
              b.falling = false;
              b.checkLadder = false;
              b.fallLadder = null;
              b.targetPlatformAfterFall = null;
              b.fallType = null;
              const platformIndex = platforms.indexOf(landing.platform);
              const dir = BARREL_PLATFORM_DIRECTIONS[platformIndex] ?? 1;
              b.vx = platformIndex === 5 ? 2.2 * dir : 2.1 * dir;
            }
          }
        } else {
          b.x += b.vx;
        }

        if (b.x < -80 || b.x > W + 80 || b.y > H + 80) {
          b.active = false;
        }

        const nearestX = Math.max(player.x, Math.min(b.x, player.x + player.w));
        const nearestY = Math.max(player.y, Math.min(b.y, player.y + player.h));
        const dx = b.x - nearestX;
        const dy = b.y - nearestY;
        if (player.invuln === 0 && (dx * dx + dy * dy) < b.radius * b.radius) {
          lives -= 1;
          updateHud();
          if (lives <= 0) {
            triggerExplosionGameOver();
          } else {
            resetPlayer(false);
          }
          return;
        }
      }

      barrels = barrels.filter(b => b.active);
    }

    function checkGoal() {
      if (
        player.x < goal.x + goal.w &&
        player.x + player.w > goal.x &&
        player.y < goal.y + goal.h &&
        player.y + player.h > goal.y
      ) {
        inWinZone = true;
        barrels = [];
        player.x = 90;
        player.y = 590;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.onLadder = false;
        player.invuln = 0;
      }
    }

    function drawPlatform(p) {
      const midY = (p.y1 + p.y2) / 2;
      const t = getNatureProgress(midY);

      const dx = p.x2 - p.x1;
      const dy = p.y2 - p.y1;
      const len = Math.hypot(dx, dy);
      const ux = dx / len;
      const uy = dy / len;

      const px = -uy;
      const py = ux;

      const beamDepth = 18;
      const flangeThickness = 4;

      const topLeft = { x: p.x1 - px * (beamDepth / 2), y: p.y1 - py * (beamDepth / 2) };
      const topRight = { x: p.x2 - px * (beamDepth / 2), y: p.y2 - py * (beamDepth / 2) };
      const bottomRight = { x: p.x2 + px * (beamDepth / 2), y: p.y2 + py * (beamDepth / 2) };
      const bottomLeft = { x: p.x1 + px * (beamDepth / 2), y: p.y1 + py * (beamDepth / 2) };

      const style = {
        main: blendColor('#4e545c', '#4e7a3d', t),
        top: blendColor('#8e98a3', '#b9ef8f', t),
        bottom: blendColor('#2b2f35', '#355229', t),
        center: blendColor('#3a4048', '#426735', t),
        brace: blendColor('#23272d', '#2d4725', t),
        bolt: blendColor('#1f2227', '#23331d', t),
        vine: blendColor('#4d6b3c', '#55b83b', t),
        moss: blendColor('#6f8a46', '#b8ff7a', t)
      };

      ctx.fillStyle = style.main;
      ctx.beginPath();
      ctx.moveTo(topLeft.x, topLeft.y);
      ctx.lineTo(topRight.x, topRight.y);
      ctx.lineTo(bottomRight.x, bottomRight.y);
      ctx.lineTo(bottomLeft.x, bottomLeft.y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = style.top;
      ctx.lineWidth = flangeThickness;
      ctx.beginPath();
      ctx.moveTo(
        p.x1 - px * (beamDepth / 2 - flangeThickness / 2),
        p.y1 - py * (beamDepth / 2 - flangeThickness / 2)
      );
      ctx.lineTo(
        p.x2 - px * (beamDepth / 2 - flangeThickness / 2),
        p.y2 - py * (beamDepth / 2 - flangeThickness / 2)
      );
      ctx.stroke();

      ctx.strokeStyle = style.bottom;
      ctx.lineWidth = flangeThickness;
      ctx.beginPath();
      ctx.moveTo(
        p.x1 + px * (beamDepth / 2 - flangeThickness / 2),
        p.y1 + py * (beamDepth / 2 - flangeThickness / 2)
      );
      ctx.lineTo(
        p.x2 + px * (beamDepth / 2 - flangeThickness / 2),
        p.y2 + py * (beamDepth / 2 - flangeThickness / 2)
      );
      ctx.stroke();

      ctx.strokeStyle = style.center;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      ctx.lineTo(p.x2, p.y2);
      ctx.stroke();

      const braceSpacing = 34;
      const braceHalfHeight = 6;

      for (let dist = 8; dist < len - 8; dist += braceSpacing) {
        const x = p.x1 + ux * dist;
        const y = p.y1 + uy * dist;

        ctx.strokeStyle = style.brace;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x - ux * 10 - px * braceHalfHeight, y - uy * 10 - py * braceHalfHeight);
        ctx.lineTo(x + ux * 10 + px * braceHalfHeight, y + uy * 10 + py * braceHalfHeight);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - ux * 10 + px * braceHalfHeight, y - uy * 10 + py * braceHalfHeight);
        ctx.lineTo(x + ux * 10 - px * braceHalfHeight, y + uy * 10 - py * braceHalfHeight);
        ctx.stroke();
      }

      for (let dist = 18; dist < len - 18; dist += 52) {
        const x = p.x1 + ux * dist;
        const y = p.y1 + uy * dist;

        ctx.fillStyle = style.bolt;
        ctx.beginPath();
        ctx.arc(x - px * 4, y - py * 4, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x + px * 4, y + py * 4, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (t > 0.12) {
        for (let dist = 18; dist < len - 18; dist += 60) {
          const x = p.x1 + ux * dist;
          const y = p.y1 + uy * dist;

          ctx.fillStyle = style.moss;
          ctx.beginPath();
          ctx.ellipse(
            x - px * 6,
            y - py * 6,
            8 + 6 * t,
            3 + 2 * t,
            Math.atan2(uy, ux),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      if (t > 0.2) {
        for (let dist = 40; dist < len - 30; dist += 90) {
          const x = p.x1 + ux * dist;
          const y = p.y1 + uy * dist;

          const vineLength = 12 + 18 * t;

          ctx.strokeStyle = style.vine;
          ctx.lineWidth = 2 + t;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.bezierCurveTo(
            x - 8,
            y + vineLength * 0.35,
            x + 10,
            y + vineLength * 0.7,
            x - 4,
            y + vineLength
          );
          ctx.stroke();

          ctx.fillStyle = style.moss;
          ctx.beginPath();
          ctx.ellipse(x - 5, y + vineLength * 0.35, 3 + 2 * t, 2, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(x + 3, y + vineLength * 0.65, 3 + 2 * t, 2, 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawLadder(l) {
      const midY = (l.yTop + l.yBottom) / 2;
      const t = getNatureProgress(midY);
      const railWidth = 6;

      const style = {
        rail: blendColor('#4e545c', '#4a7d3e', t),
        railHighlight: blendColor('#9aa3ad', '#c0f49a', t),
        rung: blendColor('#6c737c', '#5f9650', t),
        rungHighlight: blendColor('#cfd6dd', '#e5ffd0', t),
        vine: blendColor('#56723f', '#4fbb39', t),
        leaf: blendColor('#7aa24d', '#baff7f', t)
      };

      ctx.fillStyle = style.rail;
      ctx.fillRect(l.x, l.yTop, railWidth, l.yBottom - l.yTop);
      ctx.fillRect(l.x + l.width - railWidth, l.yTop, railWidth, l.yBottom - l.yTop);

      ctx.fillStyle = style.railHighlight;
      ctx.fillRect(l.x + 1, l.yTop, 2, l.yBottom - l.yTop);
      ctx.fillRect(l.x + l.width - 3, l.yTop, 2, l.yBottom - l.yTop);

      let rungCount = 0;
      for (let y = l.yTop + 10; y < l.yBottom - 6; y += 16) {
        ctx.fillStyle = style.rung;
        ctx.fillRect(l.x + railWidth, y, l.width - railWidth * 2, 5);

        ctx.fillStyle = style.rungHighlight;
        ctx.fillRect(l.x + railWidth + 1, y, l.width - railWidth * 2 - 2, 2);

        if (t > 0.18 && rungCount % 2 === 0) {
          const vineAmount = 0.35 + t * 0.8;

          ctx.strokeStyle = style.vine;
          ctx.lineWidth = 2 + t * 0.5;
          ctx.beginPath();
          ctx.moveTo(l.x + 4, y - 2);
          ctx.bezierCurveTo(
            l.x - 4, y + 4,
            l.x + 10, y + 8 + 4 * vineAmount,
            l.x + 3, y + 12 + 6 * vineAmount
          );
          ctx.stroke();

          ctx.fillStyle = style.leaf;
          ctx.beginPath();
          ctx.ellipse(l.x + 1, y + 5, 3 + 2 * t, 2, -0.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(l.x + 7, y + 11, 3 + 2 * t, 2, 0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        rungCount++;
      }
    }

    function drawPlayer() {
      if (!inWinZone && player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0) return;

      if (playerLoaded) {
        const imgW = 40;
        const imgH = 40;
        const drawX = player.x + (player.w / 2) - (imgW / 2);
        const drawY = player.y - 6;
        ctx.drawImage(playerImg, drawX, drawY, imgW, imgH);
      } else {
        ctx.fillStyle = '#ffd451';
        ctx.fillRect(player.x + 6, player.y, 12, 12);
        ctx.fillStyle = '#d62d2d';
        ctx.fillRect(player.x + 4, player.y + 12, 16, 10);
        ctx.fillStyle = '#3d7eff';
        ctx.fillRect(player.x + 2, player.y + 22, 8, 8);
        ctx.fillRect(player.x + 14, player.y + 22, 8, 8);
        ctx.fillStyle = '#fff';
        ctx.fillRect(player.x + (player.facing === 1 ? 14 : 8), player.y + 4, 2, 2);
      }
    }

    function drawBarrel(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate((b.x + b.y) * 0.02);

      const r = b.radius;
      ctx.fillStyle = '#e0b800';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(-r * 0.6, -r, r * 0.4, r * 2);

      ctx.fillStyle = '#c49a00';
      ctx.fillRect(-r + 2, -r + 3, r * 2 - 4, 4);
      ctx.fillRect(-r + 2, r - 7, r * 2 - 4, 4);

      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#1a1a1a';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const angle = (i * 2 * Math.PI) / 3;
        ctx.arc(0, 0, r * 0.4, angle - 0.4, angle + 0.4);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#39d10a';
      ctx.beginPath();
      ctx.moveTo(-r * 0.6, -r * 0.2);
      ctx.lineTo(-r * 0.4, r * 0.4);
      ctx.lineTo(-r * 0.2, -r * 0.2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(r * 0.3, -r * 0.4);
      ctx.lineTo(r * 0.5, r * 0.6);
      ctx.lineTo(r * 0.7, -r * 0.3);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawGoal() {
      if (bunkerLoaded) {
        const imgW = 120;
        const imgH = 85;
        const drawX = goal.x - 20;
        const drawY = goal.y - 30;
        ctx.drawImage(bunkerImg, drawX, drawY, imgW, imgH);
      } else {
        ctx.fillStyle = '#b7f171';
        ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        ctx.strokeStyle = '#263d12';
        ctx.lineWidth = 3;
        ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
        ctx.fillStyle = '#1c1c1c';
        ctx.font = 'bold 12px Arial';
        ctx.fillText('SAFE', goal.x + 16, goal.y + 16);
        ctx.fillText('ZONE', goal.x + 13, goal.y + 30);
      }
    }

    function drawKong() {
      if (hazmatLoaded) {
        const aspect = hazmatImg.width / hazmatImg.height;
        const targetH = kong.h;
        const targetW = targetH * aspect;
        const drawX = kong.x + (kong.w - targetW) / 2;
        const groundOffset = 20;
        ctx.drawImage(hazmatImg, drawX, kong.y - groundOffset, targetW, targetH);
      } else {
        ctx.fillStyle = '#e0cf36';
        ctx.fillRect(kong.x + 30, kong.y + 26, 48, 44);
        ctx.fillRect(kong.x + 18, kong.y + 34, 16, 34);
        ctx.fillRect(kong.x + 76, kong.y + 34, 16, 34);
        ctx.fillStyle = '#1c1f22';
        ctx.fillRect(kong.x + 39, kong.y + 8, 30, 22);
      }
    }

    function drawExplosion() {
      if (!explosionActive || !explosionLoaded) return;
      ctx.drawImage(explosionImg, 0, 0, W, H);
    }

    function drawHUDOverlay() {
      if (inWinZone) return;
      if (!gameOver && !win) return;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 52px Arial';
      ctx.fillText(win ? 'YOU WIN!' : 'GAME OVER', W / 2, H / 2 - 20);
      ctx.font = '24px Arial';
      ctx.fillText(win ? 'You reached the bunker.' : gameOverMessage, W / 2, H / 2 + 30);
      ctx.textAlign = 'left';
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);

      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#5a2d12');
      sky.addColorStop(0.35, '#2b180d');
      sky.addColorStop(0.7, '#12110d');
      sky.addColorStop(1, '#0a0d09');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(124, 58, 22, 0.18)';
      ctx.fillRect(0, 40, W, 120);
      ctx.fillStyle = 'rgba(83, 101, 28, 0.12)';
      ctx.fillRect(0, 150, W, 90);

      for (let i = 0; i < 10; i++) {
        const baseX = 40 + i * 95;
        const baseY = 250 + (i % 2) * 35;
        for (let j = 0; j < 6; j++) {
          ctx.fillStyle = `rgba(24, 24, 24, ${0.18 - j * 0.02})`;
          ctx.beginPath();
          ctx.ellipse(baseX + j * 4, baseY - j * 35, 34 + j * 6, 18 + j * 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < 14; i++) {
        const x = 18 + i * 68;
        const h = 110 + (i % 4) * 40;
        ctx.fillStyle = i % 2 === 0 ? '#16120f' : '#221914';
        ctx.fillRect(x, H - 215 - h, 42, h);
        ctx.fillRect(x + 12, H - 215 - h - 110, 16, 110);
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(x + 5, H - 215 - h + 20, 8, 8);
        ctx.fillRect(x + 18, H - 215 - h + 20, 8, 8);
        ctx.fillRect(x + 29, H - 215 - h + 20, 8, 8);
      }

      ctx.fillStyle = '#16120f';
      ctx.fillRect(0, H - 98, W, 98);
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#201915' : '#2a211b';
        ctx.beginPath();
        ctx.arc(20 + i * 34, H - 90 + (i % 3) * 10, 18 + (i % 4) * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 7; i++) {
        ctx.fillStyle = 'rgba(163, 255, 41, 0.35)';
        ctx.beginPath();
        ctx.ellipse(90 + i * 125, H - 36 + (i % 2) * 5, 70, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(210, 255, 90, 0.18)';
        ctx.beginPath();
        ctx.ellipse(90 + i * 125, H - 39 + (i % 2) * 5, 40, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }



      for (const p of platforms) drawPlatform(p);
      for (const l of ladders) drawLadder(l);
      drawGoal();
      drawKong();

      const barrelW = 34;
      const barrelH = 42;
      const bottomY = spawn.y - 28;
      const leftX = spawn.x - 116;
      const rightX = leftX + barrelW - 2;
      const topX = leftX + (rightX - leftX) / 2;
      const topY = bottomY - barrelH + 8;

      const stackPositions = [
        { x: leftX, y: bottomY },
        { x: rightX, y: bottomY },
        { x: topX, y: topY }
      ];

      for (const pos of stackPositions) {
        if (toxicBarrelLoaded) {
          ctx.drawImage(toxicBarrelImg, pos.x, pos.y, barrelW, barrelH);
        } else {
          ctx.fillStyle = '#70861f';
          ctx.fillRect(pos.x, pos.y, barrelW, barrelH);
          ctx.strokeStyle = '#37420f';
          ctx.lineWidth = 2;
          ctx.strokeRect(pos.x, pos.y, barrelW, barrelH);
        }
      }
    }

    function drawWinZoneBackground() {
      ctx.clearRect(0, 0, W, H);

      if (endBgLoaded) {
        ctx.drawImage(endBgImg, 0, 0, W, H);
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#94c7d8');
        sky.addColorStop(0.55, '#5d9a7b');
        sky.addColorStop(1, '#2f5f41');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);
      }

      for (const p of winZonePlatforms) {
        const dx = p.x2 - p.x1;
        const dy = p.y2 - p.y1;
        const len = Math.hypot(dx, dy);
        const ux = dx / len;
        const uy = dy / len;
        const px = -uy;
        const py = ux;
        const thickness = p.thickness;

        const topLeft = { x: p.x1 - px * (thickness / 2), y: p.y1 - py * (thickness / 2) };
        const topRight = { x: p.x2 - px * (thickness / 2), y: p.y2 - py * (thickness / 2) };
        const bottomRight = { x: p.x2 + px * (thickness / 2), y: p.y2 + py * (thickness / 2) };
        const bottomLeft = { x: p.x1 + px * (thickness / 2), y: p.y1 + py * (thickness / 2) };

        ctx.fillStyle = '#5c4631';
        ctx.beginPath();
        ctx.moveTo(topLeft.x, topLeft.y);
        ctx.lineTo(topRight.x, topRight.y);
        ctx.lineTo(bottomRight.x, bottomRight.y);
        ctx.lineTo(bottomLeft.x, bottomLeft.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#87c760';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1 - 6);
        ctx.lineTo(p.x2, p.y2 - 6);
        ctx.stroke();

        ctx.fillStyle = '#a7e57a';
        for (let x = Math.min(p.x1, p.x2) + 15; x < Math.max(p.x1, p.x2) - 10; x += 45) {
          ctx.beginPath();
          ctx.ellipse(x, lineYAtX(p, x) - 6, 12, 4, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const l of winZoneLadders) {
        const railWidth = 6;
        ctx.fillStyle = '#72624c';
        ctx.fillRect(l.x, l.yTop, railWidth, l.yBottom - l.yTop);
        ctx.fillRect(l.x + l.width - railWidth, l.yTop, railWidth, l.yBottom - l.yTop);

        ctx.fillStyle = '#d6d0b2';
        for (let y = l.yTop + 10; y < l.yBottom - 6; y += 16) {
          ctx.fillRect(l.x + railWidth, y, l.width - railWidth * 2, 5);
        }
      }

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, W, 90);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 34px Arial';
      ctx.fillText('You progressed towards a better future!', W / 2, 45);
      ctx.font = '20px Arial';
      ctx.fillText('Congrats!!!', W / 2, 72);
      ctx.textAlign = 'left';
    }

    function draw() {
      if (inWinZone) {
        drawWinZoneBackground();
        drawPlayer();
        return;
      }

      drawBackground();
      for (const b of barrels) drawBarrel(b);
      drawPlayer();
      drawExplosion();
      drawHUDOverlay();
    }

    function update() {
      if (explosionActive) {
        explosionTimer--;
        if (explosionTimer <= 0) {
          explosionActive = false;
        }
      }

      if (gameOver) return;

      if (inWinZone) {
        updatePlayer();
        return;
      }

      if (win) return;

      gameClock++;
      barrelSpawnTimer--;
      if (barrelSpawnTimer <= 0) {
        spawnBarrel();
        const speedup = Math.max(55, 120 - Math.floor(gameClock / 400));
        barrelSpawnTimer = speedup;
      }

      updatePlayer();
      updateBarrels();
      checkGoal();

      if (player.y + player.h >= H) {
        triggerExplosionGameOver('You chose to ignore the problem');
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'Space' && !gameOver && !win && player.onGround && !player.onLadder) {
        player.vy = JUMP_SPEED;
        player.onGround = false;
      }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    restartBtn.addEventListener('click', () => resetPlayer(true));

    resetPlayer(true);
    loop();
  </script>
</body>
